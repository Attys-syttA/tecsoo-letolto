[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tecsoo-letolto"
version = "0.1.0-dev"
description = "TecsoLetolto portable Windows media downloader"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Attys" }
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8"
]
build = [
  "pyinstaller>=6"
]

[project.scripts]
tecsoletolto = "tecsoo_letolto.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
